name: Build Professional Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app-source.part-*'
      - 'README_ANDROID_APP.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch quietly
        shell: bash
        run: git clone --quiet --depth 1 --branch android-professional-apk https://github.com/aljwaal1/analis.git repo

      - name: Restore Android project
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          echo PART01_LATE_BLOCKS
          for off in $(seq 12000 100 13900); do printf '%s ' "$off"; dd if=android-app-source.part-01 bs=1 skip="$off" count=100 status=none | sha256sum; done
          echo PART01_TAIL
          tail -c 100 android-app-source.part-01; echo
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p2 = Path('android-app-source.part-02')
          s2 = p2.read_text(encoding='utf-8')
          if len(s2) == 12847:
              s2 = s2[:9753] + 'm' + s2[9753:]
          print('PART02_REPAIRED', hashlib.sha256(s2.encode()).hexdigest())
          PY
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: repo/android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Analyzer-Pro-APK
          path: repo/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
