name: Build Professional Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app-source.part-*'
      - 'README_ANDROID_APP.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          mkdir -p android-app
          cat android-app-source.part-* | base64 --decode > /tmp/android-app-source.tar.xz
          tar -xJf /tmp/android-app-source.tar.xz -C android-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Analyzer-Pro-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
