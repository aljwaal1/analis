name: Build Professional Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: git clone --quiet --depth 1 --branch android-professional-apk https://github.com/aljwaal1/analis.git repo

      - name: Restore verified Android project
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('android-app-source.part-01')
          s = p.read_text()
          if len(s) == 13999:
              s = s[:11897] + 'p' + s[11898:]
              s = s[:12586] + 'h' + s[12586:]
              p.write_text(s)
          p = Path('android-app-source.part-02')
          s = p.read_text()
          if len(s) == 12847:
              s = s[:9753] + 'm' + s[9753:]
              p.write_text(s)
          checks = {
            'android-app-source.part-00':'df1d2a2c0065fd8a0077c0ec871b953a3ac514aaf03aba923ce0504b4cedc436',
            'android-app-source.part-01':'dcebaf208a466d8b0e1867e3268b0476d0301dcca4985089c0ccdf9ca6f75b9f',
            'android-app-source.part-02':'65906d5e3bb57f40c1da963022f7069c0c0530866e7c3f48c70af7ab7e356eba'}
          for name, expected in checks.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected
          PY
          cat android-app-source.part-* | base64 --decode > /tmp/android-app.tar.xz
          echo 'cf3aeec69d2e11797e96b50c9df1d798bc0b486966e6cb4d08fb3ce0bbf3b8d8  /tmp/android-app.tar.xz' | sha256sum -c -
          mkdir android-app
          tar -xJf /tmp/android-app.tar.xz -C android-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        id: apk_build
        continue-on-error: true
        working-directory: repo/android-app
        run: gradle assembleDebug --stacktrace --console=plain > /tmp/gradle-build.log 2>&1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: /tmp/gradle-build.log
          if-no-files-found: error

      - name: Stop on build failure
        if: steps.apk_build.outcome != 'success'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Analyzer-Pro-APK
          path: repo/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
