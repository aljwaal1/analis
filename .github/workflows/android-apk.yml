name: Build Professional Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app-source.part-*'
      - 'README_ANDROID_APP.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch quietly
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet --depth 1 --branch android-professional-apk https://github.com/aljwaal1/analis.git repo

      - name: Restore Android project
        shell: bash
        working-directory: repo
        run: |
          set -euxo pipefail
          wc -c android-app-source.part-*
          cat android-app-source.part-* > /tmp/android-app-source.b64
          base64 --decode /tmp/android-app-source.b64 > /tmp/android-app-source.tar.xz
          wc -c /tmp/android-app-source.tar.xz
          sha256sum /tmp/android-app-source.tar.xz
          xz --test /tmp/android-app-source.tar.xz
          mkdir -p android-app
          tar -xJf /tmp/android-app-source.tar.xz -C android-app
          test -f android-app/settings.gradle
          test -f android-app/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: repo/android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Analyzer-Pro-APK
          path: repo/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
